name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cbot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore .\CT-TraderBot.sln

      - name: Build
        run: dotnet build .\CT-TraderBot.sln --configuration Release --no-restore

      - name: Run core policy unit tests
        run: dotnet test .\tests\CTTraderBot.Core.Tests\CTTraderBot.Core.Tests.csproj --configuration Release --no-build --no-restore
